[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigen-cli"
version = "0.1.0"
description = "Zero-API, browser-based AI generation toolkit. Turn any web AI (Gemini, ChatGPT, Claude) into a batch generation engine."
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "aigen-cli"}
]
dependencies = [
    "selenium>=4.20.0",
    "webdriver-manager>=4.0.2",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Full dataset generation mode (TUI, dedup, HuggingFace push)
dataset = [
    "textual>=0.50.0",
    "playwright>=1.40.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
    "APScheduler>=3.10.0",
    "croniter>=2.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
]
# MCP server integration
mcp = [
    "mcp>=0.1.0",
]

[project.scripts]
aigen = "aigen.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
